{{define "content"}}
<link rel="stylesheet" href="/static/css/p2p-scrum-poker.css" />
<script src="/static/js/peer.min.js"></script>
<script src="/static/js/p2p-scrum-poker.js"></script>

<div class="container mt-5" id="poker-app">
    <!-- Room Setup Section -->
    <div id="room-setup">
        <div class="text-center mb-4">
            <h2><i class="bi bi-layers-fill me-2"></i>P2P Scrum Poker</h2>
            <p class="lead text-body-secondary">Estimate tasks with your team in real-time. No server needed.</p>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark text-light">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="userName" class="form-label">Your Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="userName" placeholder="Enter your name">
                        </div>
                        <hr>
                        <div class="text-center">
                            <button class="btn btn-outline-primary" id="createRoomBtn">Create New Room</button>
                            <p class="my-2">OR</p>
                            <div class="input-group">
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="roomIdInput" placeholder="Enter Room ID to join">
                                <button class="btn btn-outline-secondary" id="joinRoomBtn">Join Room</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Poker Room Section (hidden by default) -->
    <div id="poker-room" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3>Room ID: <span id="roomIdDisplay" class="text-primary user-select-all"></span></h3>
                <small>Share this link with your teammates to let them join.</small>
            </div>
            <div id="admin-controls" class="d-none">
                <button class="btn btn-outline-info" id="startVoteBtn">Start New Vote</button>
                <button class="btn btn-outline-warning" id="revealCardsBtn" disabled>Reveal Cards</button>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-lg-8">
                <h4>Your Hand</h4>
                <div id="voting-cards" class="d-flex flex-wrap gap-2 justify-content-center mb-4">
                    <button class="btn btn-outline-light card-vote" data-value="0">0</button>
                    <button class="btn btn-outline-light card-vote" data-value="1">1</button>
                    <button class="btn btn-outline-light card-vote" data-value="2">2</button>
                    <button class="btn btn-outline-light card-vote" data-value="3">3</button>
                    <button class="btn btn-outline-light card-vote" data-value="5">5</button>
                    <button class="btn btn-outline-light card-vote" data-value="8">8</button>
                    <button class="btn btn-outline-light card-vote" data-value="13">13</button>
                    <button class="btn btn-outline-light card-vote" data-value="21">21</button>
                    <button class="btn btn-outline-light card-vote" data-value="?">?</button>
                    <button class="btn btn-outline-light card-vote" data-value="☕">☕</button>
                </div>
                <div id="results-summary" class="text-center mb-4 d-none">
                    <hr>
                    <h3>Results</h3>
                    <p class="lead">Average: <span id="average-vote" class="fw-bold text-info"></span></p>
                </div>
            </div>
            <div class="col-lg-4">
                <h4>Participants (<span id="participant-count">0</span>)</h4>
                <ul id="participants-list" class="list-group">
                    <!-- Participant list items will be injected here -->
                </ul>
            </div>
        </div>
    </div>
</div>
{{end}}
